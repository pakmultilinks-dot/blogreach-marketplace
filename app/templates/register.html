{% extends "base.html" %}
{% block title %}Register - BlogReach{% endblock %}
{% block content %}
<h1>Create your account</h1>
<form method="post" action="/register" class="form-card">
  <label>Full name
    <input type="text" name="name" required maxlength="120">
  </label>
  <label>Email
    <input type="email" name="email" required maxlength="255">
  </label>
  <label>Password
    <input type="password" name="password" required minlength="8">
  </label>
  <label>I am joining as
    <select name="role">
      <option value="advertiser">Advertiser (buy placements)</option>
      <option value="publisher">Publisher (sell placements)</option>
    </select>
  </label>
  <button class="btn" type="submit">Register</button>
  <p class="muted">Already have an account? <a href="/login">Login</a></p>
</form>
{% endblock %}
